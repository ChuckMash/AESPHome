plugins {
  id 'com.android.application'
  id 'org.jetbrains.kotlin.android'
}

android {
  namespace 'com.aesphome'
  compileSdk 34

  defaultConfig {
    applicationId "com.aesphome"
    minSdk 22
    targetSdk 34
    versionCode 1
    versionName "0.0.1"
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  buildFeatures {
    buildConfig true
  }

  kotlinOptions {
    jvmTarget = '17'
  }
}

dependencies {
  implementation 'org.videolan.android:libvlc-all:3.7.0'
}

